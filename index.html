<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harshdeep's — Record Shop</title>
<meta name="description" content="Harshdeep Singh's record shop — step in.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-mode="overview" data-page="sign">

<div class="grain" aria-hidden="true"></div>
<div class="library-bg" aria-hidden="true"></div>

<nav class="nav">
  <div class="nav__links"></div>
  <a class="nav__resume" href="https://drive.google.com/file/d/1-5M2BheT80IlMUJ9oXyYekqQb4ygV8jG/view?usp=sharing" target="_blank" rel="noopener">Résumé ↓</a>
</nav>

<main>
  <div class="shopfront" id="shopfront">

    <p class="neon">OPEN</p>

    <div class="window">
      <div class="window__hint">thousands of records, four you'll actually want</div>
    </div>

    <div class="sign">
      Harshdeep's — Record Shop<br>
      <small>currently playing: Associate Consultant, PwC</small>
    </div>

    <button class="door-btn" id="door">Come in →</button>

  </div>
</main>

<script>
  document.getElementById('door').addEventListener('click', function () {
    const scene = document.getElementById('shopfront');
    scene.classList.add('is-leaving');
    setTimeout(function () { window.location.href = 'floor.html'; }, 450);
  });
</script>
</body>
</html>
